<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>README</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@11.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow-x: auto; }
    code { background: #f6f8fa; padding: 2px 6px; border-radius: 3px; }
    pre code { background: none; padding: 0; }
  </style>
</head>
<body>
  <div id="content">Loading README...</div>
  <script>
    fetch('https://raw.githubusercontent.com/Alex-pro61/hello/cc221c2f3a3eee873d1f0b415d7fc6dd996bae84/README.md')
      .then(r => r.text())
      .then(text => {
        const html = marked.parse(text);
        document.getElementById('content').innerHTML = DOMPurify.sanitize(html);
      })
      .catch(err => {
        document.getElementById('content').textContent = 'Error loading README: ' + err.message;
      });
  </script>
</body>
</html>
